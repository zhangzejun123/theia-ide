name: Build, package and test

on:
  push:
    branches:
      - master
      - 'feature-**'
    paths-ignore:
      - '**/*.md'
      - 'TheiaIDE logo/**'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'TheiaIDE logo/**'

jobs:
  build:
    name: ${{ matrix.os }}, Node.js v${{ matrix.node }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        node: ["22.x"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download @theia packages from theia fork
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.THEIA_REPO_TOKEN }}
          repo: zhangzejun123/theia
          workflow: ci-cd.yml
          branch: feature-axio-one-1700
          name: "@theia-${{ runner.os }}-node${{ matrix.node }}"
          path: .theia-local-packages/
          workflow_conclusion: ""

      - name: Install dependencies
        shell: bash
        run: yarn --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Override node_modules/@theia with local packages
        shell: bash
        run: node scripts/use-local-theia.js .theia-local-packages/

      - name: Fix permissions for @theia binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find node_modules/@theia -name "*.js" -path "*/bin/*" -exec chmod +x {} \;
          find node_modules/.bin -lname "../@theia/*" -exec chmod +x {} \;

      - name: Lint
        shell: bash
        run: yarn lint



      - name: Build prod package (Windows, Linux)
        if: (runner.os == 'Windows' || runner.os == 'Linux') && github.event_name != 'pull_request'
        shell: bash
        run: |
          yarn build
          yarn download:plugins
          yarn package:applications
        env:
          NODE_OPTIONS: --max_old_space_size=12288
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace electron.exe icon (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          curl -L https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe -o rcedit.exe
          ./rcedit.exe "node_modules/electron/dist/electron.exe" --set-icon "resources/icons/AxioOne.ico"

      - name: Apply custom patches
        shell: bash
        run: npx patch-package --patch-dir ./custom-patchs

      - name: Copy fontawesome-pro to node_modules
        shell: bash
        run: |
          7z x resources/fontawesome-pro.7z -onode_modules/@fortawesome/fontawesome-pro

      - name: Prepare build-cache directory
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')

          # Windows 使用 build-cache-all，Linux 使用 build-cache-linux
          if [ "${{ runner.os }}" == "Windows" ]; then
            READY_DIR="build-cache-all"
          else
            READY_DIR="build-cache-${OS_NAME}"
          fi
          mkdir -p "${READY_DIR}"

          # yarn.lock（仅 Windows）
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp yarn.lock "${READY_DIR}/yarn.lock"
          fi

          # node_modules/@theia 不放入 build-cache 目录，单独上传
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Windows: node_modules 完整（不含 @theia）
            cp -r node_modules "${READY_DIR}/node_modules"
            rm -rf "${READY_DIR}/node_modules/@theia"
          else
            # Linux: 只拷贝指定的原生模块，保留父级目录结构
            LINUX_STAGING="${READY_DIR}/_linux_staging"
            mkdir -p "${LINUX_STAGING}/@theia"
            mkdir -p "${LINUX_STAGING}/@vscode"

            cp -r node_modules/@parcel              "${LINUX_STAGING}/@parcel"
            cp -r node_modules/@theia/ffmpeg        "${LINUX_STAGING}/@theia/ffmpeg"
            cp -r node_modules/@vscode/ripgrep      "${LINUX_STAGING}/@vscode/ripgrep"
            cp -r node_modules/drivelist            "${LINUX_STAGING}/drivelist"
            cp -r node_modules/electron             "${LINUX_STAGING}/electron"
            cp -r node_modules/node-pty             "${LINUX_STAGING}/node-pty"
            cp -r node_modules/ssh2                 "${LINUX_STAGING}/ssh2"

            # 压缩为 linux.tar.gz，保留符号链接和权限
            tar -czf "${READY_DIR}/linux.tar.gz" -C "${LINUX_STAGING}" .
            rm -rf "${LINUX_STAGING}"
          fi

          # ~/.electron-gyp/{electron_version} -> electron-gyp/<os>/<version>.7z (Windows) or .tar.gz (Linux)
          ELECTRON_VERSION=$(node -p "require('./applications/electron/package.json').devDependencies.electron")
          ELECTRON_GYP_DIR="${HOME}/.electron-gyp/${ELECTRON_VERSION}"
          if [ -d "${ELECTRON_GYP_DIR}" ]; then
            mkdir -p "${READY_DIR}/electron-gyp/${OS_NAME}"
            if [ "${{ runner.os }}" == "Windows" ]; then
              7z a -t7z -mx=9 "${READY_DIR}/electron-gyp/${ELECTRON_VERSION}.7z" "${ELECTRON_GYP_DIR}/."
            else
              tar -czf "${READY_DIR}/electron-gyp/${OS_NAME}/${ELECTRON_VERSION}.tar.gz" -C "${ELECTRON_GYP_DIR}" .
            fi
          fi

          # plugins（重命名为 <plugin>-<version>，仅 Windows）
          if [ "${{ runner.os }}" == "Windows" ]; then
            node scripts/prepare-plugins.js "${READY_DIR}/plugins"
          fi

      - name: Upload build-cache-linux as artifact (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: 7z a -t7z -mx=9 build-cache-linux.7z build-cache-linux/linux.tar.gz "build-cache-linux/electron-gyp/"

      - name: Upload @theia as artifact (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: (cd node_modules/@theia && 7z a -t7z -mx=9 "../../@theia-Linux-node${{ matrix.node }}.7z" .)

      - name: Publish Linux artifacts to release
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          RELEASE_TAG="build-cache-${BRANCH_NAME}"
          gh release create "${RELEASE_TAG}" \
            --title "Build Cache: ${BRANCH_NAME}" \
            --notes "Auto-generated build cache for branch \`${BRANCH_NAME}\`." \
            --prerelease 2>/dev/null || true
          gh release upload "${RELEASE_TAG}" \
            "build-cache-linux.7z" \
            "@theia-Linux-node${{ matrix.node }}.7z" \
            --clobber

      - name: Download and merge Linux build-cache (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          RELEASE_TAG="build-cache-${BRANCH_NAME}"
          # 等待 Linux 上传 release 完成（最多等 MAX_RETRIES * RETRY_INTERVAL 秒，每 30 秒重试一次）
          MAX_RETRIES=100
          RETRY_INTERVAL=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: downloading from release ${RELEASE_TAG}..."
            if gh release download "${RELEASE_TAG}" \
                --pattern "build-cache-linux.7z" \
                --pattern "@theia-Linux-node${{ matrix.node }}.7z" \
                --dir . --clobber; then
              echo "Download succeeded."
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Timed out waiting for Linux release assets."
              exit 1
            fi
            echo "Not ready yet, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          # 从 build-cache-linux.7z 中提取 linux.tar.gz 和 electron-gyp tar.gz，放入 build-cache-all/
          ELECTRON_VERSION=$(node -p "require('./applications/electron/package.json').devDependencies.electron")
          7z e build-cache-linux.7z "build-cache-linux/linux.tar.gz" -o"build-cache-all/" -r
          mkdir -p "build-cache-all/electron-gyp"
          7z e build-cache-linux.7z "build-cache-linux/electron-gyp/linux/${ELECTRON_VERSION}.tar.gz" -o"build-cache-all/electron-gyp/" -r
          cp "@theia-Linux-node${{ matrix.node }}.7z" build-cache-all/

      - name: Compress artifacts (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          (cd node_modules/@theia && 7z a -t7z -mx=9 "../../@theia-Windows-node${{ matrix.node }}.7z" .)
          cp "@theia-Windows-node${{ matrix.node }}.7z" build-cache-all/
          cp resources/migrate_node_modules.py build-cache-all/
          7z a -t7z -mx=9 "build-cache-all.7z" "build-cache-all/"

      - name: Publish to release (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          RELEASE_TAG="build-cache-${BRANCH_NAME}"
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "Build Cache: ${BRANCH_NAME}" \
            --notes "Auto-generated combined build cache for branch \`${BRANCH_NAME}\`." \
            --prerelease \
            "build-cache-all.7z"
