name: Build, package and test

on:
  push:
    branches:
      - master
      - 'feature-**'
    paths-ignore:
      - '**/*.md'
      - 'TheiaIDE logo/**'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'TheiaIDE logo/**'

jobs:
  build:
    name: ${{ matrix.os }}, Node.js v${{ matrix.node }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        node: ["22.x"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download @theia packages from theia fork
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.THEIA_REPO_TOKEN }}
          repo: zhangzejun123/theia
          workflow: ci-cd.yml
          branch: feature-axio-one-1700
          name: "@theia-${{ runner.os }}-node${{ matrix.node }}"
          path: .theia-local-packages/
          workflow_conclusion: ""

      - name: Install dependencies
        shell: bash
        run: yarn --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Override node_modules/@theia with local packages
        shell: bash
        run: node scripts/use-local-theia.js .theia-local-packages/

      - name: Fix permissions for @theia binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find node_modules/@theia -name "*.js" -path "*/bin/*" -exec chmod +x {} \;
          find node_modules/.bin -lname "../@theia/*" -exec chmod +x {} \;

      - name: Lint
        shell: bash
        run: yarn lint



      - name: Build prod package (Windows, Linux)
        if: (runner.os == 'Windows' || runner.os == 'Linux') && github.event_name != 'pull_request'
        shell: bash
        run: |
          yarn build
          yarn download:plugins
          yarn package:applications
        env:
          NODE_OPTIONS: --max_old_space_size=12288
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace electron.exe icon (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          curl -L https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe -o rcedit.exe
          ./rcedit.exe "node_modules/electron/dist/electron.exe" --set-icon "resources/icons/AxioOne.ico"

      - name: Apply custom patches
        shell: bash
        run: npx patch-package --patch-dir ./custom-patchs

      - name: Copy fontawesome-pro to node_modules
        shell: bash
        run: |
          7z x resources/fontawesome-pro.7z -oresources/fontawesome-pro
          cp -r resources/fontawesome-pro node_modules/@fontawesome

      - name: Prepare build-cache directory
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')

          # Windows 使用 build-cache-all，Linux 使用 build-cache-linux
          if [ "${{ runner.os }}" == "Windows" ]; then
            READY_DIR="build-cache-all"
          else
            READY_DIR="build-cache-${OS_NAME}"
          fi
          mkdir -p "${READY_DIR}"

          # yarn.lock（仅 Windows）
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp yarn.lock "${READY_DIR}/yarn.lock"
          fi

          # node_modules/@theia 不放入 build-cache 目录，单独上传
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Windows: node_modules 完整（不含 @theia）
            cp -r node_modules "${READY_DIR}/node_modules"
            rm -rf "${READY_DIR}/node_modules/@theia"
          else
            # Linux: 只拷贝指定的原生模块，保留父级目录结构
            mkdir -p "${READY_DIR}/linux/@theia"
            mkdir -p "${READY_DIR}/linux/@vscode"

            cp -r node_modules/@parcel              "${READY_DIR}/linux/@parcel"
            cp -r node_modules/@theia/ffmpeg        "${READY_DIR}/linux/@theia/ffmpeg"
            cp -r node_modules/@vscode/ripgrep      "${READY_DIR}/linux/@vscode/ripgrep"
            cp -r node_modules/drivelist            "${READY_DIR}/linux/drivelist"
            cp -r node_modules/electron             "${READY_DIR}/linux/electron"
            cp -r node_modules/node-pty             "${READY_DIR}/linux/node-pty"
            cp -r node_modules/ssh2                 "${READY_DIR}/linux/ssh2"
          fi

          # ~/.electron-gyp/{electron_version} -> electron-gyp/<os>/
          ELECTRON_VERSION=$(node -p "require('./applications/electron/package.json').devDependencies.electron")
          ELECTRON_GYP_DIR="${HOME}/.electron-gyp/${ELECTRON_VERSION}"
          if [ -d "${ELECTRON_GYP_DIR}" ]; then
            mkdir -p "${READY_DIR}/electron-gyp/${OS_NAME}"
            cp -r "${ELECTRON_GYP_DIR}" "${READY_DIR}/electron-gyp/${OS_NAME}/${ELECTRON_VERSION}"
          fi

          # plugins（重命名为 <plugin>-<version>，仅 Windows）
          if [ "${{ runner.os }}" == "Windows" ]; then
            node scripts/prepare-plugins.js "${READY_DIR}/plugins"
          fi

      - name: Upload build-cache-linux as artifact (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: 7z a -t7z -mx=9 build-cache-linux.7z build-cache-linux/

      - name: Upload @theia as artifact (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: (cd node_modules/@theia && 7z a -t7z -mx=9 "../../@theia-Linux-node${{ matrix.node }}.7z" .)

      - name: Upload Linux artifacts
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-cache-linux
          path: |
            build-cache-linux.7z
            @theia-Linux-node${{ matrix.node }}.7z
          retention-days: 1
          compression-level: 0

      - name: Download and merge Linux build-cache (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 等待 Linux artifact 上传完成（最多等 MAX_RETRIES * RETRY_INTERVAL秒，每 30 秒重试一次）
          MAX_RETRIES=100
          RETRY_INTERVAL=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: downloading build-cache-linux..."
            if gh run download ${{ github.run_id }} --name build-cache-linux --dir .; then
              echo "Download succeeded."
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Timed out waiting for build-cache-linux artifact."
              exit 1
            fi
            echo "Not ready yet, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          # 解压 build-cache-linux
          7z x build-cache-linux.7z

          # 将 linux 原生模块合并到 build-cache-all/node_modules/linux
          mkdir -p build-cache-all/node_modules/linux
          cp -r build-cache-linux/linux/. build-cache-all/node_modules/linux/

          # 将 Linux electron-gyp 合并到 build-cache-all/electron-gyp/linux
          if [ -d "build-cache-linux/electron-gyp/linux" ]; then
            mkdir -p build-cache-all/electron-gyp/linux
            cp -r build-cache-linux/electron-gyp/linux/. build-cache-all/electron-gyp/linux/
          fi

          # 将 Linux @theia 放入 build-cache-all
          cp "@theia-Linux-node${{ matrix.node }}.7z" build-cache-all/

      - name: Compress artifacts (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          (cd node_modules/@theia && 7z a -t7z -mx=9 "../../@theia-Windows-node${{ matrix.node }}.7z" .)
          cp "@theia-Windows-node${{ matrix.node }}.7z" build-cache-all/
          7z a -t7z -mx=9 "build-cache-all.7z" "build-cache-all/"

      - name: Publish to release (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          ALL_TAG="build-cache-all-${BRANCH_NAME}"
          gh release delete "${ALL_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${ALL_TAG}" \
            --title "Build Cache All: ${BRANCH_NAME}" \
            --notes "Auto-generated combined build cache for branch \`${BRANCH_NAME}\`." \
            --prerelease \
            "build-cache-all.7z"
